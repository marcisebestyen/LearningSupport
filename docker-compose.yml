services:
  database: 
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    networks:
      - learning_net
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=adminuser
      - POSTGRES_PASSWORD=yourStrongPassword123!
      - POSTGRES_DB=learning_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminuser -d learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend: 
    image: ghcr.io/marcisebestyen/learningsupport-backend:latest
    ports: 
      - "8000:8000"
    networks:
      - learning_net
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=database 
    depends_on:
      database:
        condition: service_healthy

  frontend: 
    image: ghcr.io/marcisebestyen/learningsupport-frontend:latest
    ports: 
      - "4200:80" 
    networks:
      - learning_net
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

networks:
  learning_net:
    driver: bridge